<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trent’s Property Comparator</title>
    <link rel="stylesheet" href="styles.css?v=may12d">
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Trent’s Property Comparator</p>
        <h1>Trent’s Property Comparator</h1>
        <p class="deploy-marker">UI TEST MAY 11</p>
      </div>
      <div class="header-actions">
        <span id="property-count" class="count-pill">0 properties</span>
      </div>
    </header>

    <main>
      <section class="controls" aria-label="Dashboard controls">
        <div class="top-controls">
          <label class="search-field">
            <span>Search</span>
            <input id="search-input" type="search" placeholder="Address, status, garage...">
          </label>

          <label>
            <span>Status</span>
            <select id="status-filter">
              <option value="all">For Sale + Pending</option>
              <option value="For Sale">For Sale</option>
              <option value="Pending">Pending</option>
              <option value="Sold">Sold</option>
              <option value="all-statuses">All statuses</option>
            </select>
          </label>

          <label>
            <span>Market Heat</span>
            <select id="market-heat-filter">
              <option value="all">All heat</option>
              <option value="4">Hot</option>
              <option value="3">Strong</option>
              <option value="2">Moderate</option>
              <option value="1">Weak</option>
              <option value="0">Cool</option>
            </select>
          </label>
        </div>

        <div class="filter-controls">
          <div class="filter-stack">
            <label>
              <span>Filter 1</span>
              <select id="sort-primary">
              </select>
            </label>
            <label class="direction-control">
              <span>Direction 1</span>
              <select id="sort-primary-direction" aria-label="Filter 1 direction">
                <option value="asc">↑</option>
                <option value="desc">↓</option>
              </select>
            </label>
          </div>

          <div class="filter-stack">
            <label>
              <span>Filter 2</span>
              <select id="sort-secondary">
              </select>
            </label>
            <label class="direction-control">
              <span>Direction 2</span>
              <select id="sort-secondary-direction" aria-label="Filter 2 direction">
                <option value="asc">↑</option>
                <option value="desc">↓</option>
              </select>
            </label>
          </div>

          <div class="filter-stack">
            <label>
              <span>Filter 3</span>
              <select id="sort-tertiary">
              </select>
            </label>
            <label class="direction-control">
              <span>Direction 3</span>
              <select id="sort-tertiary-direction" aria-label="Filter 3 direction">
                <option value="asc">↑</option>
                <option value="desc">↓</option>
              </select>
            </label>
          </div>
        </div>
      </section>

      <section id="cards" class="cards" aria-live="polite"></section>
      <p id="empty-state" class="empty-state" hidden>No matching properties.</p>
    </main>

    <div id="details-modal" class="modal-backdrop" hidden>
      <aside class="details-panel" role="dialog" aria-modal="true" aria-labelledby="details-title">
        <div class="details-header">
          <div>
            <p class="eyebrow">Property Details</p>
            <h2 id="details-title">Property</h2>
          </div>
          <button id="details-close" class="icon-button" type="button" aria-label="Close details">×</button>
        </div>
        <div id="details-content" class="details-content"></div>
      </aside>
    </div>

    <script src="app.js?v=may12d"></script>
  </body>
</html>
