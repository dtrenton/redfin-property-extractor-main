<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trent’s Sioux Falls Property Comparator</title>
    <link rel="stylesheet" href="styles.css?v=may14f">
  </head>
  <body>
    <header class="app-header">
      <div class="header-title">
        <h1>Trent’s Sioux Falls Property Comparator</h1>
      </div>
        <div class="header-actions">
          <span id="property-count" class="count-pill">0 properties</span>
      </div>
    </header>
    <main>
      <section class="controls" aria-label="Dashboard controls">
        <div class="top-controls">
          <label class="search-field">
            <span>Search</span>
            <input id="search-input" type="search" placeholder="Address, status, garage...">
          </label>

          <label>
            <span>Price Range</span>
            <select id="price-filter">
              <option value="all">All prices</option>
              <option value="under-150">Under $150k</option>
              <option value="150-200">$150k-$200k</option>
              <option value="200-250">$200k-$250k</option>
              <option value="250-plus">$250k+</option>
            </select>
          </label>

          <label>
            <span>Current DOM</span>
            <select id="dom-filter">
              <option value="all">All DOM</option>
              <option value="0-7">0-7 days</option>
              <option value="8-14">8-14 days</option>
              <option value="15-30">15-30 days</option>
              <option value="31-plus">31+ days</option>
            </select>
          </label>
        </div>

        <div class="market-tabs" role="tablist" aria-label="Market state">
          <button class="tab-button active" type="button" data-market-state="Active">Active</button>
          <button class="tab-button" type="button" data-market-state="Pending">Pending</button>
          <button class="tab-button" type="button" data-market-state="Sold">Sold</button>
        </div>

        <details class="secondary-filter-panel">
          <summary>Filters</summary>
          <div class="secondary-filters">
            <label>
              <span>Price Drop</span>
              <select id="price-drop-filter">
                <option value="all">All</option>
                <option value="yes">Price drop</option>
                <option value="no">No price drop</option>
              </select>
            </label>
            <label><span>Beds</span><select id="beds-filter"><option value="all">Any beds</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option></select></label>
            <label><span>Baths</span><select id="baths-filter"><option value="all">Any baths</option><option value="1">1+</option><option value="2">2+</option></select></label>
            <label><span>Garage</span><select id="garage-filter"><option value="all">Any</option><option value="Yes">Garage</option><option value="No">No garage</option></select></label>
            <label><span>Basement</span><select id="basement-filter"><option value="all">Any</option><option value="yes">Basement</option><option value="no">No basement</option></select></label>
            <label><span>Fence</span><select id="fence-filter"><option value="all">Any</option><option value="yes">Fence</option><option value="no">No fence</option></select></label>
            <label class="advanced-filter" data-advanced-filter="flooring"><span>Flooring</span><input id="flooring-search" class="advanced-search" type="search" placeholder="Search flooring..." hidden><select id="flooring-filter" multiple></select></label>
            <label class="advanced-filter" data-advanced-filter="construction"><span>Construction</span><input id="construction-search" class="advanced-search" type="search" placeholder="Search construction..." hidden><select id="construction-filter" multiple></select></label>
            <label class="advanced-filter" data-advanced-filter="foundation"><span>Foundation</span><input id="foundation-search" class="advanced-search" type="search" placeholder="Search foundation..." hidden><select id="foundation-filter" multiple></select></label>
            <label class="advanced-filter" data-advanced-filter="hvac"><span>Heating/Cooling</span><input id="hvac-search" class="advanced-search" type="search" placeholder="Search HVAC..." hidden><select id="hvac-filter" multiple></select></label>
            <label class="advanced-filter" data-advanced-filter="roof"><span>Roof</span><input id="roof-search" class="advanced-search" type="search" placeholder="Search roof..." hidden><select id="roof-filter" multiple></select></label>
            <label class="advanced-filter" data-advanced-filter="water"><span>Water Source</span><input id="water-search" class="advanced-search" type="search" placeholder="Search water..." hidden><select id="water-filter" multiple></select></label>
            <label class="advanced-filter" data-advanced-filter="appliances"><span>Appliances</span><input id="appliances-search" class="advanced-search" type="search" placeholder="Search appliances..." hidden><select id="appliances-filter" multiple></select></label>
          </div>
        </details>

        <div class="filter-controls">
          <div class="filter-stack">
            <label>
              <span>Filter 1</span>
              <select id="sort-primary">
              </select>
            </label>
            <label class="direction-control">
              <span>Direction 1</span>
              <select id="sort-primary-direction" aria-label="Filter 1 direction">
                <option value="asc">↑</option>
                <option value="desc">↓</option>
              </select>
            </label>
          </div>

          <div class="filter-stack">
            <label>
              <span>Filter 2</span>
              <select id="sort-secondary">
              </select>
            </label>
            <label class="direction-control">
              <span>Direction 2</span>
              <select id="sort-secondary-direction" aria-label="Filter 2 direction">
                <option value="asc">↑</option>
                <option value="desc">↓</option>
              </select>
            </label>
          </div>

          <div class="filter-stack">
            <label>
              <span>Filter 3</span>
              <select id="sort-tertiary">
              </select>
            </label>
            <label class="direction-control">
              <span>Direction 3</span>
              <select id="sort-tertiary-direction" aria-label="Filter 3 direction">
                <option value="asc">↑</option>
                <option value="desc">↓</option>
              </select>
            </label>
          </div>
        </div>
      </section>

      <section id="cards" class="cards" aria-live="polite"></section>
      <p id="empty-state" class="empty-state" hidden>No matching properties.</p>
    </main>

    <div id="details-modal" class="modal-backdrop" hidden>
      <aside class="details-panel" role="dialog" aria-modal="true" aria-labelledby="details-title">
        <div class="details-header">
          <div>
            <p class="eyebrow">Property Details</p>
            <h2 id="details-title">Property</h2>
          </div>
          <button id="details-close" class="icon-button" type="button" aria-label="Close details">×</button>
        </div>
        <div id="details-content" class="details-content"></div>
      </aside>
    </div>

    <script src="app.js?v=may14f"></script>
  </body>
</html>
